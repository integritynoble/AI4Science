# Part A §A.7 — keep `main` releasable: full test suite on every PR.
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      COLUMNS: "200"   # wide terminal so rich/typer --help output isn't truncated in asserts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # GL libs for the optics stack (optiland/rayoptics import EGL via Qt)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1
      - run: pip install -e ".[dev]" || pip install -e .
      # First-party agent packages (entry-point sourced, live on PyPI). The
      # editable core above already satisfies their pwm-agent-core>=1,<2 pin,
      # so the local runtime stays the one under test.
      - run: >
          pip install pwm-agent-research pwm-agent-paper pwm-agent-imaging
          pwm-agent-drug pwm-agent-cancer pwm-agent-unified
          pwm-agent-claude-gpu pwm-agent-codex-gpu
      # Optional claude extra — a handful of tests import claude_agent_sdk.
      - run: pip install claude-agent-sdk || true
      # pwm-control-plane is a private repo, not on PyPI. With a read token in
      # CONTROL_PLANE_READ_TOKEN it is installed and its 13 test modules run;
      # without one, ci_gate.py reports those modules as NOT RUN (never green).
      - name: pwm-control-plane
        env: { TOKEN: "${{ secrets.CONTROL_PLANE_READ_TOKEN }}" }
        run: |
          if [ -n "$TOKEN" ]; then
            pip install "git+https://x-access-token:${TOKEN}@github.com/integritynoble/pwm-control-plane@main"
            echo "CONTROL_PLANE=1" >> "$GITHUB_ENV"
          else
            echo "::warning::CONTROL_PLANE_READ_TOKEN is not set; the pwm_control_plane test modules cannot run"
          fi
      # Run everything; the gate below decides from the JUnit report, so one
      # module that cannot import no longer hides the other ~4,600 tests.
      - run: python -m pytest -q --continue-on-collection-errors --junitxml=junit.xml || true
      - run: python scripts/ci_gate.py junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: junit, path: junit.xml }
