# Part A §A.7 — keep `main` releasable: full test suite on every PR.
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      COLUMNS: "200"   # wide terminal so rich/typer --help output isn't truncated in asserts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # GL libs for the optics stack (optiland/rayoptics import EGL via Qt)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1
      - run: pip install -e ".[dev]" || pip install -e .
      # First-party agent packages (entry-point sourced, live on PyPI). The
      # editable core above already satisfies their pwm-agent-core>=1,<2 pin,
      # so the local runtime stays the one under test.
      - run: >
          pip install pwm-agent-research pwm-agent-paper pwm-agent-imaging
          pwm-agent-drug pwm-agent-cancer pwm-agent-unified
          pwm-agent-claude-gpu pwm-agent-codex-gpu
      # Optional claude extra — a handful of tests import claude_agent_sdk.
      - run: pip install claude-agent-sdk || true
      # Secret-bearing private code is installed only on trusted main pushes.
      # The owner must provision a reviewed immutable commit and a repo-only
      # read token; a PR never receives that token or builds private code.
      - name: Validate reviewed control-plane revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { REV: "${{ vars.CONTROL_PLANE_REV }}" }
        run: '[[ "$REV" =~ ^[0-9a-f]{40}$ ]] || { echo "Missing reviewed immutable CONTROL_PLANE_REV"; exit 1; }'
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          repository: integritynoble/pwm-control-plane
          ref: ${{ vars.CONTROL_PLANE_REV }}
          token: ${{ secrets.CONTROL_PLANE_READ_TOKEN }}
          persist-credentials: false
          path: .ci-control-plane
      - name: Install reviewed control plane
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pip install ./.ci-control-plane
      - name: Independently collect expected tests
        run: |
          set +e
          python -m pytest --collect-only -q --continue-on-collection-errors -p scripts.ci_collect --ci-manifest=collection.json
          status=$?
          echo "$status" > collection-exit.txt
          exit 0
      - name: Run tests and capture termination
        run: |
          set +e
          python -m pytest -q --continue-on-collection-errors --junitxml=junit.xml
          status=$?
          echo "$status" > pytest-exit.txt
          exit 0
      - name: Require complete full-suite evidence
        if: always()
        run: python scripts/ci_gate.py junit.xml --manifest collection.json --pytest-exit pytest-exit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            junit.xml
            collection.json
            collection-exit.txt
            pytest-exit.txt
