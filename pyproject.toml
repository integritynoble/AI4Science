[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# This distribution is the PWM agent RUNTIME (the "core"): it ships the
# `ai4science.*` harness, `pwm_core.*`, and the top-level `pwm_agent_core`
# facade that standalone agent packages import and pin (`pwm-agent-core>=1,<2`).
# The `ai4science` CLI command lives here (see [project.scripts]). The
# `pwm-ai4science` name is now a thin meta-package (core + all agents) built
# separately. The dist version tracks the pwm_agent_core CONTRACT_VERSION major
# (1.x); the internal code version is `ai4science.__version__`.
name = "pwm-agent-core"
version = "1.1.8.dev14"
description = "PWM agent runtime (core): the AI4Science harness + pwm_agent_core facade that standalone PWM agent packages run on."
readme = "README.md"
# Runtime contract for standalone agent packages: they import the runtime ONLY
# via the top-level `pwm_agent_core` module (shipped by py-modules). The contract
# surface + version live in pwm_agent_core.py (CONTRACT_VERSION). Agent packages
# pin: pwm-agent-core>=1,<2.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "AI4Science Contributors" },
]
keywords = ["ai4science", "physics-world-model", "pwm", "scientific-ml", "physics-judge", "cassi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "scipy>=1.10",                                  # forward-model physics ops (ndimage/gaussian_filter)
  "httpx>=0.27",                                  # PWM login/billing + founder LLM proxy
  "prompt_toolkit>=3.0",                          # bordered/full-screen TUI (AI4SCIENCE_TUI)
  "pyreadline3>=3.4; sys_platform == 'win32'",    # arrow keys/history on Windows
  "optiland>=0.6.0",                              # Optical design simulation (Phase 0)
  "rayoptics>=0.9.8",                             # Optical design ray tracing (Phase 0)
  # A PRODUCT import, not a test one: `ai4science chat` / `--mode claude` import
  # it at module scope (ai4science/agents/claude_agent.py:170,
  # ai4science/commands/chat.py:494), and install.sh:203 already installs it by
  # default. It was only ever reachable through the `claude`/`dev` extras, which
  # made the shipped CLI's default path depend on an extra. It is on PyPI and
  # pulls in no first-party package, so there is no cycle here.
  "claude-agent-sdk>=0.1",
  # NOTE: core does NOT depend on the pwm-agent-* packages (that would be a
  # dependency cycle). The full framework (core + all agents) is the separate
  # `pwm-ai4science` meta-package.
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "build>=1.2",
  "twine>=5.0",
  # --- what the SUITE needs beyond the runtime, and why it is here ---------
  #
  # The contract in README.md is that `pip install -e ".[dev]"` alone must be
  # enough to COLLECT the suite. Collecting is not running: measured on a fresh
  # venv at daf66277, `[dev]` collected cleanly and then failed 82 tests, 81 of
  # which were the environment and not the code. Two things were missing.
  #
  # 1. `claude-agent-sdk` -- no longer listed here. It is a PRODUCT import and
  #    now sits in `dependencies` above, so the runtime carries it and `[dev]`
  #    gets it for free. The tests that import it directly (tests/test_chat.py:313
  #    monkeypatches `claude_agent_sdk.list_sessions`) are satisfied either way.
  #
  # 2. The eight first-party agent packages. The agents they ship are NOT
  #    built-in specs -- `ai4science/harness/agents/specs/` has no paper.py,
  #    cancer.py, unified_llm.py, claude_code.py ... on purpose (the split is
  #    documented at the top of this file). Around fifty tests assert on the
  #    registry those packages populate through entry points, e.g.
  #    tests/test_phase3_agents_via_packages.py:17 and
  #    tests/sarsi/test_backends.py:32. Without them those tests do not skip:
  #    they fail, on every machine that is not the maintainer's.
  #
  #    This is a cycle in the metadata -- these pin `pwm-agent-core>=1,<2` and
  #    this IS pwm-agent-core -- which is exactly why they are not in
  #    `dependencies`. As an extra it is inert for every consumer of the
  #    runtime and resolved by the editable install for developers; the same
  #    list install.sh:141 already installs.
  "pwm-agent-research",
  "pwm-agent-paper",
  "pwm-agent-imaging",
  "pwm-agent-drug",
  "pwm-agent-cancer",
  "pwm-agent-unified",
  "pwm-agent-claude-gpu",
  "pwm-agent-codex-gpu",
  #
  # NOT here, and cannot be: `pwm_control_plane` is not published, and the
  # `claude` CLI is npm rather than pip. `scripts/dev-venv.sh` installs those.
  # The foundry/control-plane tests stand a real ASGI server up over a UNIX
  # socket to drive the agent through it; uvicorn is what runs it. It is a test
  # dependency only -- nothing under ai4science/ imports it at module level
  # (ai4science/harness/llm_gateway.py:94 imports it inside main(), and that
  # module is an optional host service, see the `gateway` extra).
  "uvicorn>=0.27",
]
gateway = [
  # `python -m ai4science.harness.llm_gateway` -- the founder-credentialed host
  # LLM gateway. Not part of the CLI or the library, so not a core dependency.
  "fastapi>=0.110",
  "uvicorn>=0.27",
]
claude = [
  # Real Claude integration. Also requires the `claude` CLI on PATH
  # (`npm install -g @anthropic-ai/claude-code`) and either ANTHROPIC_API_KEY
  # in env OR `claude login` for subscription-based auth.
  "claude-agent-sdk>=0.1",
]
research-agents = [
  # The governor's research agents run their benchmarks on real corpora, and
  # two of the five cannot run at all without these — this is not a convenience
  # group. `rdkit` computes the Morgan fingerprints the drug-design benchmark
  # is built on, at benchmark-generation time and not merely at fetch time;
  # without it that agent raises rather than degrading. `pydicom` and `pillow`
  # are needed to fetch the CT and capsule corpora respectively.
  "rdkit>=2023.9",
  "pydicom>=2.4",
  "pillow>=10.0",
]

[project.scripts]
ai4science = "ai4science.cli:main"

[project.urls]
Homepage = "https://github.com/integritynoble/AI4Science"
Repository = "https://github.com/integritynoble/AI4Science"
Issues = "https://github.com/integritynoble/AI4Science/issues"
"PWM Protocol" = "https://physicsworldmodel.org"

[tool.setuptools]
py-modules = ["pwm_agent_core"]

[tool.setuptools.packages.find]
include = ["ai4science*", "pwm_core*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
ai4science = ["templates/*.md", "examples/**/*.md", "examples/**/*.py", "prompts/*.md", "harness/data/*.npz", "harness/data/specs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
